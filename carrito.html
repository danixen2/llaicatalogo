<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu selección</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero" style="border-radius:0 0 24px 24px; padding-bottom:16px;">
  <div class="wrap hero-inner" style="gap:16px; padding-top:20px; justify-content:space-between;">
    <p class="brand" id="brand-name" style="margin:0;">Tu Marca</p>
    <div class="lang-switch" id="lang-switch"></div>
  </div>
</header>

<div class="wrap">
  <a class="back-link" id="back-link" href="index.html">← Volver al catálogo</a>
  <h1 id="page-title" style="font-family:'Baloo 2', sans-serif; color:var(--purple-dark); margin:16px 0 0;">Tu selección</h1>

  <div class="cart-layout">
    <div id="cart-items"></div>

    <aside class="cart-summary">
      <h2 style="margin:0; color:var(--purple-dark); font-size:1.05rem;" id="summary-title">Resumen</h2>
      <div class="total-row">
        <span id="total-label">Total</span>
        <span id="total-value">¥0</span>
      </div>
      <button type="button" class="pdf-btn" id="download-pdf-btn" disabled>📄 Descargar PDF</button>
    </aside>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap"><span id="footer-brand">© 2024 Tu Marca</span></div>
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/cart.js"></script>
<script src="assets/vendor/jspdf.umd.min.js"></script>
<script src="assets/vendor/notosansjp-subset.js"></script>
<script src="assets/cart-page.js"></script>
</body>
</html>
